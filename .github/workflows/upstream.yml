name: Upstream

# Weekly: check that every pinned upstream file is still what the manifest says, and keep
# a copy of each archive in the "mirror" release, which the assembler falls back to.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pins still match upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m assembler.pin

  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Mirror upstream archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m assembler.mirror --mirror "$GITHUB_REPOSITORY@mirror"
