name: Build

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      firmware_ref:
        description: flipperone-mcu-firmware ref to build with the bundles
        default: dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FIRMWARE_REF: ${{ inputs.firmware_ref || 'dev' }}
  # Where the smoke tests unpack a bundle: away from the checkout, with a space in it.
  UNPACKED: unpacked toolchain

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  assemble:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: windows-x64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Assemble
        run: |
          python -m assembler --platform '${{ matrix.platform }}' --out dist \
            --tag "dev-${GITHUB_SHA::12}" --cache-dir "$RUNNER_TEMP/cache"
      - name: Re-assemble and compare (determinism)
        if: matrix.platform == 'linux-x86_64'
        run: |
          python -m assembler --platform '${{ matrix.platform }}' --out "$RUNNER_TEMP/again" \
            --tag "dev-${GITHUB_SHA::12}" --cache-dir "$RUNNER_TEMP/cache" --offline
          diff <(cut -d' ' -f1 dist/*.sha256) <(cut -d' ' -f1 "$RUNNER_TEMP"/again/*.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ matrix.platform }}
          path: |
            dist/flipperone-mcu-toolchain-*
          if-no-files-found: error
          compression-level: 0
      - name: Linux runtime libraries (picotool, OpenOCD)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0 libftdi1-2 libhidapi-hidraw0
      - name: Unpack elsewhere
        run: |
          dir="$RUNNER_TEMP/$UNPACKED"
          mkdir -p "$dir"
          case '${{ matrix.platform }}' in
            windows-*) unzip -q dist/*.zip -d "$dir" ;;
            *) tar -xzf dist/*.tar.gz -C "$dir" ;;
          esac
      - name: Smoke test (bash)
        if: runner.os != 'Windows'
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/$UNPACKED/fbtenv.sh"
          python3 tests/smoke/run.py
      - name: Smoke test (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\$env:UNPACKED\fbtenv.ps1"
          python tests/smoke/run.py
      - name: Smoke test (cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%RUNNER_TEMP%\%UNPACKED%\fbtenv.cmd"
          python tests/smoke/run.py --skip-blink

  oldest-glibc:
    needs: assemble
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 20
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates libusb-1.0-0 libftdi1-2 libhidapi-hidraw0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-linux-x86_64
          path: dist
      - name: Smoke test on glibc 2.35
        shell: bash
        run: |
          dir="$RUNNER_TEMP/$UNPACKED"
          mkdir -p "$dir"
          tar -xzf dist/*.tar.gz -C "$dir"
          # shellcheck source=/dev/null
          . "$dir/fbtenv.sh"
          python3 tests/smoke/run.py

  firmware:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: windows-x64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The firmware build has POSIX assumptions on Windows until its A-P1.2 work lands.
    continue-on-error: ${{ matrix.platform == 'windows-x64' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flipperdevices/flipperone-mcu-firmware
          ref: ${{ env.FIRMWARE_REF }}
          path: firmware
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-${{ matrix.platform }}
          path: dist
      - name: Linux runtime libraries (picotool, OpenOCD)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0 libftdi1-2 libhidapi-hidraw0
      - name: Unpack
        run: |
          dir="$RUNNER_TEMP/$UNPACKED"
          mkdir -p "$dir"
          case '${{ matrix.platform }}' in
            windows-*) unzip -q dist/*.zip -d "$dir" ;;
            *) tar -xzf dist/*.tar.gz -C "$dir" ;;
          esac
      - name: Build f2 and f1 (bash)
        if: runner.os != 'Windows'
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/$UNPACKED/fbtenv.sh"
          python3 tests/smoke/run.py --skip-blink --firmware firmware --target f2 --target f1
      - name: Build f2 and f1 (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\$env:UNPACKED\fbtenv.ps1"
          python tests/smoke/run.py --skip-blink --firmware firmware --target f2 --target f1

  docker:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flipperdevices/flipperone-mcu-firmware
          ref: ${{ env.FIRMWARE_REF }}
          path: firmware
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolchain-linux-*
          path: context
          merge-multiple: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both architectures
        run: |
          docker buildx build -f docker/Dockerfile --platform linux/amd64,linux/arm64 \
            --build-arg "TOOLCHAIN_TAG=dev-${GITHUB_SHA::12}" context
      - name: Build the firmware inside the amd64 image
        run: |
          docker buildx build -f docker/Dockerfile --platform linux/amd64 --load \
            --build-arg "TOOLCHAIN_TAG=dev-${GITHUB_SHA::12}" -t flipperone-mcu-toolchain:ci context
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD/firmware:/src" -w /src flipperone-mcu-toolchain:ci \
            sh -c 'cmake -G Ninja -S . -B /tmp/build -DFW_TARGET=f2 -DCMAKE_BUILD_TYPE=Release \
                     -DPython3_EXECUTABLE="$FLIPPERONE_TOOLCHAIN_ROOT/tools/python/bin/python3" \
                   && cmake --build /tmp/build && sha256sum /tmp/build/flipperone-mcu-firmware.uf2'
